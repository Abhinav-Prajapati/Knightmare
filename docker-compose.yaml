version: '3.8'
services:
  db_postgres:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=trashmate1234
      - POSTGRES_DB=trashmate
    ports:
      - '5432:5432'
    volumes:
      - data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"    # RabbitMQ main port 
      - "15672:15672"  # ui port 
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=trashmate1234
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  data:
    driver: local
  redis_data:
  rabbitmq_data:
